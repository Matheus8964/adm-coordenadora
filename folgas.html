
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>SUPORTE RH</title>

  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    body {
      min-height: 100vh;
    }

    .header {
      height: 65px;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }

    .logo {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .logo span {
      color: #60a5fa;
    }

    .header-info {
      font-size: 12px;
      color: #cbd5e1;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 35px 22px;
    }

    .welcome {
      margin-bottom: 28px;
    }

    .welcome h1 {
      font-size: 25px;
      margin: 0 0 8px;
    }

    .welcome p {
      color: #64748b;
      font-size: 14px;
      margin: 0;
    }

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: .7px;
      margin-bottom: 13px;
      text-transform: uppercase;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .menu-item {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 13px;
      padding: 20px;
      min-height: 95px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      color: #0f172a;
      transition: .2s;
      box-shadow: 0 2px 5px rgba(15,23,42,.04);
    }

    .menu-item:hover {
      border-color: #3b82f6;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(15,23,42,.08);
    }

    .menu-item strong {
      font-size: 14px;
    }

    .arrow {
      color: #2563eb;
      font-size: 22px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      padding: 25px 15px;
      color: #94a3b8;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .header {
        padding: 0 16px;
      }

      .container {
        padding: 25px 16px;
      }

      .welcome h1 {
        font-size: 22px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      .menu-item {
        min-height: 75px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">SISTEMA <span>INTERNO</span></div>
    <div class="header-info">Sistema de Gestão Administrativa</div>
  </header>

  <main class="container">

    <section class="welcome">
      <h1>Central de Acesso</h1>
      <p>Selecione uma opção.</p>
    </section>

    <div id="menu"></div>

  </main>

  <footer class="footer">
    SAMD
  </footer>

  <script>
    /*
     * CONFIGURAÇÃO DOS MÓDULOS
     * Cada botão abre seu próprio arquivo HTML.
     */

    const MENU = [
  {
    title: "FLUXO RH",
    items: [
      {
        label: "Painel de Aprovação",
        page: "./views/folgaspainel.html"
      },
      {
        label: "Calendário Geral",
        page: "./views/calendario.html"
      },
      {
        label: "Voltar a tela inical",
        page: "./views/index.html"
      },
    ]
  }
];

    function carregarMenu() {
      const menu = document.getElementById("menu");

      menu.innerHTML = "";

      MENU.forEach(grupo => {
        const section = document.createElement("section");
        section.className = "section";

        const titulo = document.createElement("div");
        titulo.className = "section-title";
        titulo.textContent = grupo.title;

        const grid = document.createElement("div");
        grid.className = "menu-grid";

        grupo.items.forEach(item => {
          const link = document.createElement("a");

          link.className = "menu-item";
          link.href = item.page;

          const nome = document.createElement("strong");
          nome.textContent = item.label;

          const seta = document.createElement("span");
          seta.className = "arrow";
          seta.textContent = "›";

          link.appendChild(nome);
          link.appendChild(seta);

          grid.appendChild(link);
        });

        section.appendChild(titulo);
        section.appendChild(grid);

        menu.appendChild(section);
      });
    }

    carregarMenu();

    // SERVICE WORKER
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("Erro no Service Worker:", error));
      });
    }
  </script>

</body>
</html>
